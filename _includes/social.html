<style>
  /* Every social button has the same outer height */
  .social-media-list li a {
    box-sizing: border-box;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
  }

  /* Image badges should not reserve inline baseline space */
  .social-media-list li a img {
    display: block;
    width: auto;
  }

  /* No surrounding border or horizontal padding for image badges */
  .social-media-list li a.rss-badge,
  .social-media-list li a.smallweb-badge {
    border: none;
    padding-left: 0;
    padding-right: 0;
  }

  .social-media-list li a.rss-badge img {
    height: 20px;
  }

  .social-media-list li a.smallweb-badge img {
    height: 31px;
  }
</style>

<ul class="social-media-list">
{%- for entry in site.minima.social_links -%}
  <li>
    <a
      rel="me"
      href="{{ entry.url }}"
      target="_blank"
      title="{{ entry.title }}"
    >
      <span class="grey fa-brands fa-{{ entry.icon }} fa-lg"></span>
    </a>
  </li>
{%- endfor -%}

{% unless site.minima.hide_site_feed_link %}
  <li>
    <a
      href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}"
      target="_blank"
      title="Subscribe to syndication feed"
    >
      <svg class="svg-icon grey" viewBox="0 0 16 16">
        <path d="M12.8 16C12.8 8.978 7.022 3.2 0 3.2V0c8.777 0 16 7.223 16 16h-3.2zM2.194
          11.61c1.21 0 2.195.985 2.195 2.196 0 1.21-.99 2.194-2.2 2.194C.98 16 0 15.017 0
          13.806c0-1.21.983-2.195 2.194-2.195zM10.606
          16h-3.11c0-4.113-3.383-7.497-7.496-7.497v-3.11c5.818 0 10.606 4.79 10.606 10.607z"
        />
      </svg>
    </a>
  </li>
{%- endunless %}

  <li>
    <a
      class="rss-badge"
      href="https://iheartrss.com/"
      target="_blank"
      rel="noopener"
      title="I love RSS"
    >
      <picture>
        <source
          srcset="https://iheartrss.com/iheartrss-dark.svg"
          media="(prefers-color-scheme: dark)"
        >
        <img
          src="https://iheartrss.com/iheartrss.svg"
          alt="I love RSS"
        >
      </picture>
    </a>
  </li>

  <li>
    <a
      class="smallweb-badge"
      href="https://kagi.com/smallweb"
      target="_blank"
      rel="noopener"
      title="Kagi Small Web"
    >
      <img
        src="https://camo.githubusercontent.com/05046a28621d58344a06ba01b0c99bd44538f39c5a01e4e3b769f57de2f3f61c/68747470733a2f2f6b616769666565646261636b2e6f72672f6173736574732f66696c65732f323032352d31312d32372f313736343235303937332d3730383336392d38387833312d322e676966"
        alt="Kagi Small Web"
      >
    </a>
  </li>
</ul>
